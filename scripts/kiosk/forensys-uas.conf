# ForenSys - Forzar modo UAS para chips Realtek RTL9210 (Adaptadores NVMe por USB)
#
# Por qué existe este archivo:
#   Sin esta configuración, Linux enlaza el chip RTL9210 al controlador
#   "usb-storage" (modo legado), que es más lento y bloquea el protocolo
#   TRIM/UNMAP. Al forzar UAS (USB Attached SCSI), el chip puede utilizar
#   comandos SCSI UNMAP que equivalen al TRIM nativo de NVMe.
#
# El flag 'u' en quirks de usb-storage significa: "usar driver UAS en lugar
# del modo BOT (Bulk-Only Transfer) legacy".
#
# Chips Realtek RTL9210 — VID:PIDs conocidos (Vendor 0bda = Realtek):
options usb-storage quirks=0bda:9210:u,0bda:9211:u,0bda:9215:u,0bda:9216:u
